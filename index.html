<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>智能语音输入法</title>
</head>
<body>
<div class="main-card">
  <div class="title">智能语音输入法</div>
  <div class="state-info" id="statusMsg">系统就绪，可开始语音录入</div>
  <textarea id="showArea" placeholder="语音识别内容将实时展示在此处"></textarea>
  <div class="btn-group">
    <button id="beginBtn">开始录入</button>
    <button id="endBtn">暂停录入</button>
    <button id="resetBtn">清空文本</button>
  </div>
</div>
</body>
</html>
