<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <title>智能语音输入工具</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", sans-serif;
    }

    body {
      background-color: #edf2fa;
      padding: 35px 18px;
    }

    .main-card {
      max-width: 680px;
      margin: 0 auto;
      background: #ffffff;
      padding: 28px;
      border-radius: 14px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.07);
    }

    .title {
      text-align: center;
      margin-bottom: 18px;
      color: #1f2937;
      font-size: 22px;
    }

    .state-info {
      text-align: center;
      color: #555555;
      margin-bottom: 12px;
      font-size: 14px;
    }

    #showArea {
      width: 100%;
      height: 210px;
      padding: 15px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      font-size: 16px;
      line-height: 1.65;
      resize: none;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 18px;
    }

    .btn-style {
      padding: 9px 20px;
      border: none;
      border-radius: 7px;
      cursor: pointer;
      font-size: 14px;
    }

    .btn-start {
      background: #3b82f6;
      color: #fff;
    }

    .btn-pause {
      background: #22c55e;
      color: #fff;
    }

    .btn-clear {
      background: #ef4444;
      color: #fff;
    }
  </style>
</head>

<body>
  <div class="main-card">
    <div class="title">智能语音输入法</div>
    <div class="state-info" id="statusMsg">系统就绪，可开始语音录入</div>
    <textarea id="showArea" placeholder="语音识别内容将实时展示在此处"></textarea>
    <div class="btn-group">
      <button class="btn-style btn-start" id="beginBtn">开始录入</button>
      <button class="btn-style btn-pause" id="endBtn">暂停录入</button>
      <button class="btn-style btn-clear" id="resetBtn">清空文本</button>
    </div>
  </div>

  <script>
    // 获取页面DOM元素
    let displayBox = document.getElementById('showArea');
    let statusNotice = document.getElementById('statusMsg');
    let beginButton = document.getElementById('beginBtn');
    let endButton = document.getElementById('endBtn');
    let resetButton = document.getElementById('resetBtn');

    // 声明语音识别对象与运行状态
    let voiceRecognize = null;
    let isListening = false;

    // 检测浏览器语音识别支持情况
    if (window.SpeechRecognition || window.webkitSpeechRecognition) {
      // 兼容处理
      let SpeechEngine = window.SpeechRecognition || window.webkitSpeechRecognition;
      voiceRecognize = new SpeechEngine();

      // 识别基础配置
      voiceRecognize.lang = 'zh-CN';
      voiceRecognize.continuous = true;
      voiceRecognize.interimResults = true;

      // 接收语音识别结果
      voiceRecognize.onresult = function (resData) {
        let outputStr = '';
        // 循环读取识别片段
        for (let k = resData.resultIndex; k < resData.results.length; k++) {
          outputStr += resData.results[k][0].transcript;
        }
        // 简单文本优化
        outputStr = outputStr.replace(/\s{2,}/g, ' ');
        displayBox.value = outputStr;
      };

      // 异常处理
      voiceRecognize.onerror = function () {
        statusNotice.innerText = '识别异常，请重新开启';
        isListening = false;
      };
    } else {
      statusNotice.innerText = '当前浏览器不支持语音功能，请更换Chrome/Edge';
    }

    // 开始语音监听
    beginButton.onclick = function () {
      if (!isListening) {
        voiceRecognize.start();
        isListening = true;
        statusNotice.innerText = '正在接收语音，请说话...';
      }
    };

    // 停止语音监听
    endButton.onclick = function () {
      if (isListening) {
        voiceRecognize.stop();
        isListening = false;
        statusNotice.innerText = '已暂停语音录入';
      }
    };

    // 清空文本内容
    resetButton.onclick = function () {
      displayBox.value = '';
      statusNotice.innerText = '内容已清空，可重新开始';
    };
  </script>
</body>

</html>
